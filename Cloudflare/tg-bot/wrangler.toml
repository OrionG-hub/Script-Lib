# Cloudflare/tg-bot/wrangler.toml
name = "tg-bot"
main = "worker.js"
compatibility_date = "2026-08-24"
keep_vars = true

[[d1_databases]]
binding = "TG_BOT_DB"
database_name = "tg-bot-db"
database_id = "95abaa8c-9c8b-4912-ae1a-3cfa2827f583"

[observability]
